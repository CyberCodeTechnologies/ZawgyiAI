version: '3.8'

services:
  zawgyi-ai:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    container_name: zawgyi-ai-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - zawgyi-network
    command: npm run dev

networks:
  zawgyi-network:
    driver: bridge
