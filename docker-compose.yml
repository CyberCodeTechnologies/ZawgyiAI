version: '3.8'

services:
  zawgyi-ai:
    build: .
    container_name: zawgyi-ai
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - zawgyi-network

  redis:
    image: redis:7-alpine
    container_name: zawgyi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - zawgyi-network

  nginx:
    image: nginx:alpine
    container_name: zawgyi-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - zawgyi-ai
    restart: unless-stopped
    networks:
      - zawgyi-network

volumes:
  redis-data:

networks:
  zawgyi-network:
    driver: bridge
